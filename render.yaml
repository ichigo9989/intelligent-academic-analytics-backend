services:
  - type: web
    name: academic-analytics-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/test
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: academic_analytics
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: academic-analytics-ml
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: academic-analytics-ml
    runtime: docker
    plan: free
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    healthCheckPath: /health
    envVars:
      - key: ML_API_KEY
        sync: false
      - key: MODEL_PATH
        value: /app/artifacts/eduinsight-model.joblib
