spring.application.name=academic-analytics-backend

# Use local settings by default; Render will activate the production profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Render provides PORT automatically
server.port=${PORT:8081}

# Shared JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Local development fallback only; production requires JWT_SECRET.
app.jwt.secret=${JWT_SECRET:local-dev-secret-key-change-before-deployment-2026}
app.ml.base-url=${ML_SERVICE_URL:}
app.ml.api-key=${ML_API_KEY:}
app.ml.base-url=${ML_SERVICE_URL:}
app.ml.api-key=${ML_API_KEY:}
